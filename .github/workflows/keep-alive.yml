name: Render Keep-Alive Watchdog

on:
  schedule:
    # Runs every 9 minutes to keep Render Web Service active 24/7
    - cron: '*/9 * * * *'
  workflow_dispatch:

concurrency:
  group: cricverse-keepalive
  cancel-in-progress: true

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping CricVerse Web Service on Render
        run: |
          echo "Pinging CricVerse health endpoint on Render (9min interval)..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 --retry 3 --retry-delay 5 https://cricverse-7nuc.onrender.com/)
          echo "Received HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ CricVerse is awake and healthy!"
          else
            echo "⚠️ Health check returned status $HTTP_STATUS"
            exit 1
          fi
